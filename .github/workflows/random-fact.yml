name: Update Dynamic README Highlights

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1' # Weekly on Monday at 00:00 UTC

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate randomized SVG Dev Trivia card and update README
        run: python .github/scripts/update_readme.py

      - name: Commit and push changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/fact_state.json .github/assets
          git commit -m "feat(readme): randomize dev-trivia SVG filename to prevent image caching"
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push