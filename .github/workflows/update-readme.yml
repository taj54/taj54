name: Update Dynamic README Highlights

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1' # Weekly on Monday at 00:00 UTC
  push:
    paths:
      - '.github/scripts/**'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync README sections and generate Dev Trivia card
        run: node .github/scripts/sync-readme.mjs

      - name: Commit and push changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/fact_state.json .github/assets
          git commit -m "chore(readme): sync README sections and trivia card"
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push