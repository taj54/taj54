<svg width="800" height="195" viewBox="0 0 800 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#151C2C"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowOrbA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity="0.06"/>
      <animateTransform attributeName="patternTransform" type="translate" values="0,0; 20,20" dur="12s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="798" height="193" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="1" y="1" width="798" height="193" rx="16" fill="url(#bgGrad)"/>
    <rect x="1" y="1" width="798" height="193" rx="16" fill="url(#dots)"/>

    <!-- Dual orbiting glow orbs -->
    <circle cx="670" cy="45" r="200" fill="url(#glowOrbA)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -140,35; -40,75; 0,0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="145" r="180" fill="url(#glowOrbB)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 160,-45; 60,-85; 0,0" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- Sweeping diagonal light sheen -->
    <polygon points="-140,0 -20,0 80,195 -40,195" fill="url(#sheenGrad)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 940,0" dur="5.5s" repeatCount="indefinite"/>
    </polygon>

    <!-- Floating particles & light streaks -->
    <circle cx="450" cy="37" r="3.2" fill="#D97706" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.6s" begin="1.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 14,-16; 0,0" dur="3.6s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="431" cy="62" r="2.6" fill="#F59E0B" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.5s" begin="1.1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 14,12; 0,0" dur="3.5s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="161" cy="141" r="2.0" fill="#D97706" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.9s" begin="1.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 14,-12; 0,0" dur="4.9s" begin="1.0s" repeatCount="indefinite"/></circle>
    <circle cx="381" cy="114" r="2.8" fill="#F59E0B" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.9s" begin="0.3s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 14,16; 0,0" dur="3.9s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="229" cy="83" r="1.8" fill="#D97706" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="5.3s" begin="0.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 14,16; 0,0" dur="5.3s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="634" cy="78" r="3.5" fill="#F59E0B" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="5.6s" begin="1.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 14,-12; 0,0" dur="5.6s" begin="1.0s" repeatCount="indefinite"/></circle>
    <circle cx="501" cy="67" r="3.6" fill="#D97706" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.6s" begin="1.3s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 14,16; 0,0" dur="3.6s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="698" cy="39" r="1.8" fill="#F59E0B" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="5.5s" begin="1.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 14,-16; 0,0" dur="5.5s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="482" cy="121" r="2.9" fill="#D97706" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.2s" begin="1.1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; -14,16; 0,0" dur="3.2s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="282" cy="64" r="2.6" fill="#F59E0B" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="5.4s" begin="1.9s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; -14,-16; 0,0" dur="5.4s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="308" cy="35" r="2.6" fill="#D97706" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.9s" begin="0.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; -14,-12; 0,0" dur="3.9s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="92" r="2.0" fill="#F59E0B" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.8s" begin="0.8s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; -14,12; 0,0" dur="3.8s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="378" cy="20" r="1.6" fill="#D97706" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.4s" begin="0.9s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; -14,16; 0,0" dur="4.4s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="606" cy="79" r="2.2" fill="#F59E0B" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.5s" begin="2.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 14,-12; 0,0" dur="4.5s" begin="2.5s" repeatCount="indefinite"/></circle>
    <line x1="-90" y1="34" x2="-10" y2="34" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"><animateTransform attributeName="transform" type="translate" values="0,0; 920,0" dur="4.7s" begin="0.0s" repeatCount="indefinite"/></line>
    <line x1="-90" y1="72" x2="-10" y2="72" stroke="#D97706" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"><animateTransform attributeName="transform" type="translate" values="0,0; 920,0" dur="5.4s" begin="1.4s" repeatCount="indefinite"/></line>
    <line x1="-90" y1="110" x2="-10" y2="110" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"><animateTransform attributeName="transform" type="translate" values="0,0; 920,0" dur="5.0s" begin="2.8s" repeatCount="indefinite"/></line>

    <!-- Animated top accent bar -->
    <rect x="32" y="1" width="180" height="3.5" rx="1.75" fill="url(#accentGrad)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 556,0; 0,0" dur="4.8s" repeatCount="indefinite"/>
    </rect>

    <!-- Trivia badge -->
    <g transform="translate(32, 24)">
      <rect width="152" height="28" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-opacity="0.65"/>
      <circle cx="16" cy="14" r="4.2" fill="#F59E0B">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3.2;5.4;3.2" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="18" fill="#F8FAFC" font-size="11" font-weight="700" letter-spacing="1.1"
            font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">DEV TRIVIA #08</text>
    </g>

    <!-- Category pill -->
    <g transform="translate(194, 24)">
      <rect width="100" height="28" rx="14" fill="#D97706" fill-opacity="0.18" stroke="#F59E0B" stroke-opacity="0.5"/>
      <text x="50" y="18" text-anchor="middle" fill="#F59E0B" font-size="11" font-weight="700" letter-spacing="1"
            font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">DEBUGGING</text>
    </g>

    <g transform="translate(716, 22)">
  <rect width="52" height="52" rx="14" fill="#161F30" stroke="#F59E0B" stroke-opacity="0.6" stroke-width="1.2"/>
  <path d="M16 20h16v9a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6v-9z" stroke="#F59E0B" stroke-width="2.2"/><path d="M32 22h3a3 3 0 0 1 0 6h-3" stroke="#F59E0B" stroke-width="2.2"/><line x1="16" y1="38" x2="32" y2="38" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"/><path d="M20 16c0-2.5 2.5-2.5 2.5-5M27 16c0-2.5 2.5-2.5 2.5-5" stroke="#D97706" stroke-width="2" stroke-linecap="round" fill="none"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.9s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,2.5; 0,-2.5; 0,2.5" dur="1.9s" repeatCount="indefinite"/></path>
</g>

    <text x="32" y="98" fill="#F8FAFC" font-size="20" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">&quot;I debug best with strong coffee in hand.&quot;</text>

    <line x1="32" y1="154" x2="768" y2="154" stroke="#1E293B" stroke-width="1"/>

    <text x="32" y="176" fill="#94A3B8" font-size="11" font-weight="600"
          font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">CYCLE 21/23</text>
    <rect x="118" y="168" width="220" height="7" rx="3.5" fill="#1E293B"/>
    <rect x="118" y="168" width="200" height="7" rx="3.5" fill="url(#accentGrad)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2s" repeatCount="indefinite"/>
    </rect>

    <text x="768" y="176" text-anchor="end" fill="#64748B" font-size="11"
          font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">UPDATED NOV 27, 2026 • GITHUB ACTIONS</text>
  </g>

  <rect x="1" y="1" width="798" height="193" rx="16" stroke="url(#accentGrad)" stroke-width="1.6"/>
</svg>
