<svg width="800" height="195" viewBox="0 0 800 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#131926"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
    <radialGradient id="glowOrb" cx="0.88" cy="0.2" r="0.55">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Card Base -->
  <rect x="1" y="1" width="798" height="193" rx="16" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="1.5"/>
  <rect x="1" y="1" width="798" height="193" rx="16" fill="url(#dots)"/>
  <rect x="1" y="1" width="798" height="193" rx="16" fill="url(#glowOrb)"/>

  <!-- Top Accent Bar -->
  <rect x="32" y="1" width="140" height="3" rx="1.5" fill="url(#accentGrad)"/>

  <!-- Header Badges -->
  <g transform="translate(32, 24)">
    <rect width="152" height="28" rx="14" fill="#1E293B" stroke="#DC2626" stroke-opacity="0.5"/>
    <circle cx="16" cy="14" r="4" fill="#DC2626">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="18" fill="#F1F5F9" font-size="11" font-weight="700" letter-spacing="1.1"
          font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">DEV TRIVIA #21</text>
  </g>

  <g transform="translate(194, 24)">
    <rect width="116" height="28" rx="14" fill="#DC2626" fill-opacity="0.14" stroke="#DC2626" stroke-opacity="0.35"/>
    <text x="58" y="18" text-anchor="middle" fill="#F87171" font-size="11" font-weight="700" letter-spacing="1"
          font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">REFACTORING</text>
  </g>

  <!-- Right Floating Emoji Emblem -->
  <g transform="translate(716, 22)">
    <rect width="52" height="52" rx="14" fill="#161F30" stroke="#334155" stroke-width="1"/>
    <text x="26" y="34" text-anchor="middle" font-size="25">🔥</text>
  </g>

  <!-- Main Fact Text -->
  <text x="32" y="102" fill="#F8FAFC" font-size="21" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">&quot;I once fixed a bug by rewriting the whole module.&quot;</text>

  <!-- Footer Divider -->
  <line x1="32" y1="154" x2="768" y2="154" stroke="#1E293B" stroke-width="1"/>

  <!-- Cycle Progress Bar -->
  <text x="32" y="176" fill="#94A3B8" font-size="11" font-weight="600"
        font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">CYCLE 07/23</text>
  <rect x="118" y="168" width="220" height="7" rx="3.5" fill="#1E293B"/>
  <rect x="118" y="168" width="66" height="7" rx="3.5" fill="url(#accentGrad)"/>

  <!-- Timestamp -->
  <text x="768" y="176" text-anchor="end" fill="#64748B" font-size="11"
        font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">UPDATED NOV 26, 2026 • GITHUB ACTIONS</text>
</svg>
