<svg width="800" height="195" viewBox="0 0 800 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#131926"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <radialGradient id="glowOrb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.04"/>
      <animateTransform attributeName="patternTransform" type="translate" values="0,0; 20,20" dur="18s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="798" height="193" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="1" y="1" width="798" height="193" rx="16" fill="url(#bgGrad)"/>
    <rect x="1" y="1" width="798" height="193" rx="16" fill="url(#dots)"/>

    <!-- Drifting ambient glow orb -->
    <circle cx="680" cy="48" r="180" fill="url(#glowOrb)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -70,25; 15,40; 0,0" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- Floating particles -->
    <circle cx="470" cy="99" r="1.5" fill="#EF4444" fill-opacity="0.35"><animate attributeName="opacity" values="0.15;0.65;0.15" dur="4.6s" begin="1.7s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 8,-7; 0,0" dur="4.6s" begin="1.7s" repeatCount="indefinite"/></circle>
  <circle cx="335" cy="98" r="1.9" fill="#F87171" fill-opacity="0.35"><animate attributeName="opacity" values="0.15;0.65;0.15" dur="7.8s" begin="3.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 8,-10; 0,0" dur="7.8s" begin="3.0s" repeatCount="indefinite"/></circle>
  <circle cx="725" cy="62" r="2.5" fill="#EF4444" fill-opacity="0.35"><animate attributeName="opacity" values="0.15;0.65;0.15" dur="7.8s" begin="2.8s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 8,-7; 0,0" dur="7.8s" begin="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="400" cy="131" r="2.4" fill="#F87171" fill-opacity="0.35"><animate attributeName="opacity" values="0.15;0.65;0.15" dur="5.4s" begin="2.1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; -8,10; 0,0" dur="5.4s" begin="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="671" cy="67" r="1.6" fill="#EF4444" fill-opacity="0.35"><animate attributeName="opacity" values="0.15;0.65;0.15" dur="5.4s" begin="0.7s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 8,10; 0,0" dur="5.4s" begin="0.7s" repeatCount="indefinite"/></circle>
  <circle cx="205" cy="36" r="2.0" fill="#F87171" fill-opacity="0.35"><animate attributeName="opacity" values="0.15;0.65;0.15" dur="5.9s" begin="0.7s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 8,-10; 0,0" dur="5.9s" begin="0.7s" repeatCount="indefinite"/></circle>
  <circle cx="490" cy="100" r="2.2" fill="#EF4444" fill-opacity="0.35"><animate attributeName="opacity" values="0.15;0.65;0.15" dur="6.1s" begin="3.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; -8,-7; 0,0" dur="6.1s" begin="3.0s" repeatCount="indefinite"/></circle>
  <circle cx="502" cy="83" r="1.6" fill="#F87171" fill-opacity="0.35"><animate attributeName="opacity" values="0.15;0.65;0.15" dur="6.3s" begin="2.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 8,10; 0,0" dur="6.3s" begin="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="420" cy="82" r="1.7" fill="#EF4444" fill-opacity="0.35"><animate attributeName="opacity" values="0.15;0.65;0.15" dur="8.1s" begin="0.1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 8,-10; 0,0" dur="8.1s" begin="0.1s" repeatCount="indefinite"/></circle>
  <circle cx="639" cy="51" r="2.5" fill="#F87171" fill-opacity="0.35"><animate attributeName="opacity" values="0.15;0.65;0.15" dur="4.5s" begin="1.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; -8,10; 0,0" dur="4.5s" begin="1.0s" repeatCount="indefinite"/></circle>

    <!-- Animated top accent bar -->
    <rect x="32" y="1" width="160" height="3" rx="1.5" fill="url(#accentGrad)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 576,0; 0,0" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- Trivia badge -->
    <g transform="translate(32, 24)">
      <rect width="152" height="28" rx="14" fill="#1E293B" stroke="#EF4444" stroke-opacity="0.5"/>
      <circle cx="16" cy="14" r="4" fill="#EF4444">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3.5;4.8;3.5" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="18" fill="#F1F5F9" font-size="11" font-weight="700" letter-spacing="1.1"
            font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">DEV TRIVIA #07</text>
    </g>

    <!-- Category pill -->
    <g transform="translate(194, 24)">
      <rect width="116" height="28" rx="14" fill="#EF4444" fill-opacity="0.14" stroke="#EF4444" stroke-opacity="0.35"/>
      <text x="58" y="18" text-anchor="middle" fill="#F87171" font-size="11" font-weight="700" letter-spacing="1"
            font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">WAR STORIES</text>
    </g>

    <g transform="translate(716, 22)">
  <rect width="52" height="52" rx="14" fill="#161F30" stroke="#EF4444" stroke-opacity="0.45" stroke-width="1"/>
  <g><path d="M26 14l11 21H15L26 14z" stroke="#F87171" stroke-width="2" stroke-linejoin="round"/><line x1="26" y1="22" x2="26" y2="29" stroke="#F87171" stroke-width="2.2" stroke-linecap="round"/><circle cx="26" cy="32.5" r="1.3" fill="#F87171"/><animateTransform attributeName="transform" type="translate" values="0,0; -1,0; 1,0; -1,0; 0,0" dur="2.6s" repeatCount="indefinite"/></g>
</g>

    <text x="32" y="98" fill="#F8FAFC" font-size="20" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">&quot;I once broke production with a single missing comma.&quot;</text>

    <line x1="32" y1="154" x2="768" y2="154" stroke="#1E293B" stroke-width="1"/>

    <text x="32" y="176" fill="#94A3B8" font-size="11" font-weight="600"
          font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">CYCLE 20/23</text>
    <rect x="118" y="168" width="220" height="7" rx="3.5" fill="#1E293B"/>
    <rect x="118" y="168" width="191" height="7" rx="3.5" fill="url(#accentGrad)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
    </rect>

    <text x="768" y="176" text-anchor="end" fill="#64748B" font-size="11"
          font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">UPDATED NOV 27, 2026 • GITHUB ACTIONS</text>
  </g>

  <rect x="1" y="1" width="798" height="193" rx="16" stroke="url(#accentGrad)" stroke-width="1.5"/>
</svg>
