<svg width="800" height="195" viewBox="0 0 800 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#151C2C"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowOrbA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity="0.06"/>
      <animateTransform attributeName="patternTransform" type="translate" values="0,0; 20,20" dur="12s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="798" height="193" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="1" y="1" width="798" height="193" rx="16" fill="url(#bgGrad)"/>
    <rect x="1" y="1" width="798" height="193" rx="16" fill="url(#dots)"/>

    <!-- Dual orbiting glow orbs -->
    <circle cx="670" cy="45" r="200" fill="url(#glowOrbA)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -140,35; -40,75; 0,0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="145" r="180" fill="url(#glowOrbB)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 160,-45; 60,-85; 0,0" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- Sweeping diagonal light sheen -->
    <polygon points="-140,0 -20,0 80,195 -40,195" fill="url(#sheenGrad)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 940,0" dur="5.5s" repeatCount="indefinite"/>
    </polygon>

    <!-- Floating particles & light streaks -->
    <circle cx="473" cy="141" r="2.6" fill="#7C3AED" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.4s" begin="2.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; -14,-12; 0,0" dur="3.4s" begin="2.0s" repeatCount="indefinite"/></circle>
    <circle cx="638" cy="39" r="1.9" fill="#A78BFA" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.9s" begin="0.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; -14,-16; 0,0" dur="4.9s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="339" cy="90" r="3.1" fill="#7C3AED" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.8s" begin="0.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 14,16; 0,0" dur="4.8s" begin="0.0s" repeatCount="indefinite"/></circle>
    <circle cx="472" cy="22" r="2.1" fill="#A78BFA" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.4s" begin="1.4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 14,-16; 0,0" dur="3.4s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="372" cy="110" r="2.8" fill="#7C3AED" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.4s" begin="0.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; -14,12; 0,0" dur="3.4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="574" cy="88" r="2.0" fill="#A78BFA" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.4s" begin="1.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 14,-12; 0,0" dur="3.4s" begin="1.0s" repeatCount="indefinite"/></circle>
    <circle cx="691" cy="21" r="1.8" fill="#7C3AED" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="5.3s" begin="0.9s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 14,-12; 0,0" dur="5.3s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="696" cy="127" r="1.7" fill="#A78BFA" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.9s" begin="1.4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 14,12; 0,0" dur="4.9s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="464" cy="80" r="3.5" fill="#7C3AED" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.7s" begin="1.3s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 14,16; 0,0" dur="4.7s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="419" cy="45" r="2.9" fill="#A78BFA" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.0s" begin="2.4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; -14,16; 0,0" dur="4.0s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="151" cy="111" r="2.0" fill="#7C3AED" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.6s" begin="0.9s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; -14,-12; 0,0" dur="4.6s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="764" cy="46" r="3.2" fill="#A78BFA" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.8s" begin="1.3s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 14,-16; 0,0" dur="3.8s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="593" cy="46" r="1.7" fill="#7C3AED" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.2s" begin="0.3s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; -14,16; 0,0" dur="4.2s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="124" cy="65" r="1.8" fill="#A78BFA" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="6.1s" begin="0.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; -14,16; 0,0" dur="6.1s" begin="0.5s" repeatCount="indefinite"/></circle>
    <line x1="-90" y1="34" x2="-10" y2="34" stroke="#A78BFA" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"><animateTransform attributeName="transform" type="translate" values="0,0; 920,0" dur="4.7s" begin="0.0s" repeatCount="indefinite"/></line>
    <line x1="-90" y1="72" x2="-10" y2="72" stroke="#7C3AED" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"><animateTransform attributeName="transform" type="translate" values="0,0; 920,0" dur="6.0s" begin="1.4s" repeatCount="indefinite"/></line>
    <line x1="-90" y1="110" x2="-10" y2="110" stroke="#A78BFA" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"><animateTransform attributeName="transform" type="translate" values="0,0; 920,0" dur="5.2s" begin="2.8s" repeatCount="indefinite"/></line>

    <!-- Animated top accent bar -->
    <rect x="32" y="1" width="180" height="3.5" rx="1.75" fill="url(#accentGrad)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 556,0; 0,0" dur="4.8s" repeatCount="indefinite"/>
    </rect>

    <!-- Trivia badge -->
    <g transform="translate(32, 24)">
      <rect width="152" height="28" rx="14" fill="#1E293B" stroke="#A78BFA" stroke-opacity="0.65"/>
      <circle cx="16" cy="14" r="4.2" fill="#A78BFA">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3.2;5.4;3.2" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="18" fill="#F8FAFC" font-size="11" font-weight="700" letter-spacing="1.1"
            font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">DEV TRIVIA #18</text>
    </g>

    <!-- Category pill -->
    <g transform="translate(194, 24)">
      <rect width="100" height="28" rx="14" fill="#7C3AED" fill-opacity="0.18" stroke="#A78BFA" stroke-opacity="0.5"/>
      <text x="50" y="18" text-anchor="middle" fill="#A78BFA" font-size="11" font-weight="700" letter-spacing="1"
            font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">AI AGENTS</text>
    </g>

    <g transform="translate(716, 22)">
  <rect width="52" height="52" rx="14" fill="#161F30" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="1.2"/>
  <g><circle cx="26" cy="26" r="7.5" stroke="#A78BFA" stroke-width="2.2" stroke-dasharray="14 6"/><circle cx="26" cy="26" r="3" fill="#A78BFA"><animate attributeName="r" values="2.2;4;2.2" dur="1.7s" repeatCount="indefinite"/></circle><path d="M26 11v5M26 36v5M11 26h5M36 26h5" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round"/><animateTransform attributeName="transform" type="rotate" from="0 26 26" to="360 26 26" dur="8s" repeatCount="indefinite"/></g>
</g>

    <text x="32" y="98" fill="#F8FAFC" font-size="20" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">&quot;I use CrewAI to teach old code new tricks.&quot;</text>

    <line x1="32" y1="154" x2="768" y2="154" stroke="#1E293B" stroke-width="1"/>

    <text x="32" y="176" fill="#94A3B8" font-size="11" font-weight="600"
          font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">CYCLE 01/23</text>
    <rect x="118" y="168" width="220" height="7" rx="3.5" fill="#1E293B"/>
    <rect x="118" y="168" width="12" height="7" rx="3.5" fill="url(#accentGrad)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2s" repeatCount="indefinite"/>
    </rect>

    <text x="768" y="176" text-anchor="end" fill="#64748B" font-size="11"
          font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">UPDATED NOV 27, 2026 • GITHUB ACTIONS</text>
  </g>

  <rect x="1" y="1" width="798" height="193" rx="16" stroke="url(#accentGrad)" stroke-width="1.6"/>
</svg>
