<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0b1220"/>
            <stop offset="100%" stop-color="#111c32"/>
          </linearGradient>
          <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#62e6c5"/>
            <stop offset="100%" stop-color="#70a7ff"/>
          </linearGradient>
          <style>
            .eyebrow { font: 700 15px Arial, sans-serif; letter-spacing: 3px; fill: #70e3c4; }
            .heading { font: 700 54px Arial, sans-serif; fill: #f4f7fb; }
            .intro { font: 400 21px Arial, sans-serif; fill: #b8c5d8; }
            .item-title { font: 700 15px Arial, sans-serif; letter-spacing: 2px; fill: #75e3c5; }
            .item-body { font: 400 18px Arial, sans-serif; fill: #dce5f1; }
            .quote { font: italic 24px Georgia, serif; fill: #f4f7fb; }
            .attribution { font: 700 13px Arial, sans-serif; letter-spacing: 2px; fill: #8ea2bd; }
            .number { font: 700 14px Arial, sans-serif; fill: #71849e; }
          </style>
        </defs>
<rect width="1200" height="900" rx="30" fill="url(#bg)"/>
<circle cx="1080" cy="80" r="210" fill="#284d66" opacity=".15"/>
<circle cx="1100" cy="70" r="135" fill="none" stroke="#62e6c5" stroke-opacity=".18"/>
<rect x="72" y="68" width="1056" height="764" rx="24" fill="#111d30" stroke="#2a3a51" stroke-width="1.5"/>
<rect x="72" y="68" width="7" height="764" rx="3.5" fill="url(#accent)"/>
<text class="heading" x="120" y="210">About Me</text>
<rect x="120" y="239" width="90" height="4" rx="2" fill="url(#accent)"/>
<text class="intro" x="120" y="294">I build software that feels effortless on the surface and stays rock-solid under load. From</text>
<text class="intro" x="120" y="325">multi-tenant SaaS architectures to framework-agnostic open-source SDKs, I care deeply about</text>
<text class="intro" x="120" y="356">clean boundaries, developer ergonomics, and shipping products that scale.</text>
<text class="number" x="120" y="450">01</text>
<text class="item-title" x="170" y="450">CORE FOCUS</text>
<text class="item-body" x="170" y="484">Clean architecture, scalable multi-tenant systems, and high-craft user experiences</text>
<text class="number" x="120" y="555">02</text>
<text class="item-title" x="170" y="555">ENGINEERING MINDSET</text>
<text class="item-body" x="170" y="589">Lifelong builder exploring distributed systems, agentic AI workflows, and</text>
<text class="item-body" x="170" y="615">open-source tooling</text>
<text class="number" x="120" y="675">03</text>
<text class="item-title" x="170" y="675">COLLABORATION</text>
<text class="item-body" x="170" y="709">Open to technical partnerships, high-impact product engineering, and open-source</text>
<text class="item-body" x="170" y="735">quests</text>
<rect x="120" y="765" width="960" height="48" rx="10" fill="#172840" stroke="#2d4560"/>
<text x="145" y="800" font-size="32" fill="#62e6c5">“</text>
<text class="quote" x="185" y="793">Clean architecture is about intent: your system should scream what it does.</text>
<text class="attribution" x="185" y="832">— ROBERT C. MARTIN (UNCLE BOB)</text>
</svg>