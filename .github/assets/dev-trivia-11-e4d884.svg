<svg width="800" height="195" viewBox="0 0 800 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#151C2C"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FB923C" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowOrbA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity="0.06"/>
      <animateTransform attributeName="patternTransform" type="translate" values="0,0; 20,20" dur="12s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="798" height="193" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="1" y="1" width="798" height="193" rx="16" fill="url(#bgGrad)"/>
    <rect x="1" y="1" width="798" height="193" rx="16" fill="url(#dots)"/>

    <!-- Dual orbiting glow orbs -->
    <circle cx="670" cy="45" r="200" fill="url(#glowOrbA)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -140,35; -40,75; 0,0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="145" r="180" fill="url(#glowOrbB)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 160,-45; 60,-85; 0,0" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- Sweeping diagonal light sheen -->
    <polygon points="-140,0 -20,0 80,195 -40,195" fill="url(#sheenGrad)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 940,0" dur="5.5s" repeatCount="indefinite"/>
    </polygon>

    <!-- Floating particles & light streaks -->
    <circle cx="555" cy="85" r="2.2" fill="#F97316" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="5.8s" begin="2.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 14,12; 0,0" dur="5.8s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="627" cy="27" r="2.5" fill="#FB923C" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.6s" begin="1.4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 14,12; 0,0" dur="4.6s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="101" cy="130" r="1.6" fill="#F97316" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.9s" begin="0.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; -14,-16; 0,0" dur="3.9s" begin="0.0s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="45" r="1.7" fill="#FB923C" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.9s" begin="1.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; -14,-12; 0,0" dur="4.9s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="157" cy="95" r="2.6" fill="#F97316" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.7s" begin="2.3s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; -14,16; 0,0" dur="4.7s" begin="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="147" cy="120" r="2.2" fill="#FB923C" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.6s" begin="1.7s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; -14,16; 0,0" dur="3.6s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="484" cy="115" r="2.3" fill="#F97316" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.2s" begin="2.1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; -14,-12; 0,0" dur="4.2s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="599" cy="50" r="2.8" fill="#FB923C" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="6.2s" begin="0.4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 14,12; 0,0" dur="6.2s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="166" cy="103" r="1.9" fill="#F97316" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.7s" begin="0.9s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; -14,-12; 0,0" dur="3.7s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="512" cy="130" r="1.7" fill="#FB923C" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.2s" begin="1.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 14,12; 0,0" dur="4.2s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="369" cy="143" r="1.7" fill="#F97316" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="6.0s" begin="1.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; -14,12; 0,0" dur="6.0s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="266" cy="30" r="3.0" fill="#FB923C" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="5.2s" begin="0.7s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 14,-12; 0,0" dur="5.2s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="704" cy="54" r="3.2" fill="#F97316" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.5s" begin="1.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; -14,-12; 0,0" dur="3.5s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="683" cy="47" r="1.9" fill="#FB923C" fill-opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.8s" begin="0.4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 14,16; 0,0" dur="4.8s" begin="0.4s" repeatCount="indefinite"/></circle>
    <line x1="-90" y1="34" x2="-10" y2="34" stroke="#FB923C" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"><animateTransform attributeName="transform" type="translate" values="0,0; 920,0" dur="4.7s" begin="0.0s" repeatCount="indefinite"/></line>
    <line x1="-90" y1="72" x2="-10" y2="72" stroke="#F97316" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"><animateTransform attributeName="transform" type="translate" values="0,0; 920,0" dur="6.0s" begin="1.4s" repeatCount="indefinite"/></line>
    <line x1="-90" y1="110" x2="-10" y2="110" stroke="#FB923C" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"><animateTransform attributeName="transform" type="translate" values="0,0; 920,0" dur="5.8s" begin="2.8s" repeatCount="indefinite"/></line>

    <!-- Animated top accent bar -->
    <rect x="32" y="1" width="180" height="3.5" rx="1.75" fill="url(#accentGrad)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 556,0; 0,0" dur="4.8s" repeatCount="indefinite"/>
    </rect>

    <!-- Trivia badge -->
    <g transform="translate(32, 24)">
      <rect width="152" height="28" rx="14" fill="#1E293B" stroke="#FB923C" stroke-opacity="0.65"/>
      <circle cx="16" cy="14" r="4.2" fill="#FB923C">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3.2;5.4;3.2" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="18" fill="#F8FAFC" font-size="11" font-weight="700" letter-spacing="1.1"
            font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">DEV TRIVIA #11</text>
    </g>

    <!-- Category pill -->
    <g transform="translate(194, 24)">
      <rect width="100" height="28" rx="14" fill="#F97316" fill-opacity="0.18" stroke="#FB923C" stroke-opacity="0.5"/>
      <text x="50" y="18" text-anchor="middle" fill="#FB923C" font-size="11" font-weight="700" letter-spacing="1"
            font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">GIT CRAFT</text>
    </g>

    <g transform="translate(716, 22)">
  <rect width="52" height="52" rx="14" fill="#161F30" stroke="#FB923C" stroke-opacity="0.6" stroke-width="1.2"/>
  <circle cx="19" cy="18" r="3.2" stroke="#FB923C" stroke-width="2.2"/><circle cx="19" cy="34" r="3.2" stroke="#FB923C" stroke-width="2.2"/><circle cx="33" cy="24" r="3.2" fill="#F97316" stroke="#F97316" stroke-width="2"><animate attributeName="r" values="2.8;4.8;2.8" dur="1.8s" repeatCount="indefinite"/></circle><path d="M19 21v10M19 24c0 3 14 3 14 0" stroke="#FB923C" stroke-width="2.2"/>
</g>

    <text x="32" y="98" fill="#F8FAFC" font-size="20" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">&quot;Git commit messages are my form of storytelling.&quot;</text>

    <line x1="32" y1="154" x2="768" y2="154" stroke="#1E293B" stroke-width="1"/>

    <text x="32" y="176" fill="#94A3B8" font-size="11" font-weight="600"
          font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">CYCLE 05/23</text>
    <rect x="118" y="168" width="220" height="7" rx="3.5" fill="#1E293B"/>
    <rect x="118" y="168" width="47" height="7" rx="3.5" fill="url(#accentGrad)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2s" repeatCount="indefinite"/>
    </rect>

    <text x="768" y="176" text-anchor="end" fill="#64748B" font-size="11"
          font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">UPDATED NOV 27, 2026 • GITHUB ACTIONS</text>
  </g>

  <rect x="1" y="1" width="798" height="193" rx="16" stroke="url(#accentGrad)" stroke-width="1.6"/>
</svg>
